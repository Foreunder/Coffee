<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c16">
<meta property="og:title" content="Foreunder Coffee House">
<meta property="og:description" content="See our coffees on your phone.">
<meta property="og:image" content="https://foreunder.github.io/Coffee/menu/logo.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>Foreunder Coffee House</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a links-clubhouse menu card. Phone = one column with sticky order bar; TV board = three columns; bar = order queue. Single dark look by design (a dim pub at night). */
:root{
  --ground:#0f1c16;      /* deep clubhouse green */
  --panel:#16271f;
  --panel-2:#1c3127;
  --ink:#f0e7d3;         /* ivory card stock */
  --muted:#b9ad90;
  --brass:#c9a24f;
  --brass-dim:#8f7436;
  --oxblood:#8a2a35;
  --rule:rgba(201,162,79,.28);
  --ok:#86b98f;
  --display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --italic:"IM Fell English","Iowan Old Style",Georgia,serif;
  --body:"Alegreya","Iowan Old Style",Georgia,serif;
  --label:"Alegreya Sans SC","Gill Sans","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:17px/1.55 var(--body);padding-inline:16px;padding-block:0 120px;-webkit-font-smoothing:antialiased}
a{color:var(--brass)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto}
.tartan{height:10px;margin-inline:-16px;background:
  repeating-linear-gradient(90deg,transparent 0 22px,rgba(201,162,79,.55) 22px 24px,transparent 24px 46px,rgba(138,42,53,.8) 46px 52px,transparent 52px 70px),
  repeating-linear-gradient(0deg,var(--panel-2) 0 3px,var(--ground) 3px 6px)}
.label{font:500 13px/1.2 var(--label);letter-spacing:.14em;text-transform:lowercase;color:var(--brass)}

/* Crest */
header.crest{text-align:center;padding-block:28px 20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.crest .est{font:500 12px/1 var(--label);letter-spacing:.24em;color:var(--muted);text-transform:lowercase}
.crest h1{font:400 clamp(40px,11vw,64px)/1 var(--display);letter-spacing:.06em;margin:4px 0 0;color:var(--ink)}
.crest .house{font:italic 400 20px/1.2 var(--italic);color:var(--brass)}
.crest .rule{width:120px;height:1px;background:var(--rule);margin-top:10px}

.crest .logo{width:min(320px,78vw);aspect-ratio:1;display:block;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 66%,transparent 76%);mask-image:radial-gradient(circle at 50% 50%,#000 66%,transparent 76%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.board .logo{width:calc(8*var(--u));aspect-ratio:1;display:block;margin:calc(-1*var(--u)) 0 calc(-.5*var(--u)) calc(-1*var(--u));-webkit-mask-image:radial-gradient(circle,#000 66%,transparent 76%);mask-image:radial-gradient(circle,#000 66%,transparent 76%)}
section{padding-block:22px}
h2{font:400 26px/1.15 var(--display);letter-spacing:.04em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-style:italic}

/* Drinks list: menu-card rows */
.drinks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.drink{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--rule)}
.drink:first-child{border-top:1px solid var(--rule)}
.drink .n{font:400 22px/1.2 var(--display);letter-spacing:.03em}
.drink .sig{grid-column:1;font:700 11px/1 var(--label);letter-spacing:.2em;text-transform:lowercase;color:var(--oxblood);background:var(--brass);justify-self:start;padding:5px 8px;border-radius:3px;margin-bottom:4px}
.drink.signature .n{color:var(--brass)}
.drink .l{font:500 13px/1.3 var(--label);letter-spacing:.08em;color:var(--brass);text-transform:lowercase}
.drink .d{grid-column:1;color:var(--muted);font-size:15px;line-height:1.45;min-width:0}
.pickbox{margin:0 0 16px}
.pickstart{width:100%}
.picker{background:var(--panel,#16271f);border:1px solid var(--rule);border-radius:12px;padding:16px}
.picker .pq{font:400 21px/1.2 var(--display);margin:0 0 12px}
.picker .pbtns{display:flex;flex-wrap:wrap;gap:8px}
.picker .pbtns .btn{flex:1 1 auto}
.picker .pdots{font:500 12px/1 var(--label);letter-spacing:.14em;text-transform:lowercase;color:var(--muted);margin-top:12px}
.pick-res .pk{font:500 12px/1 var(--label);letter-spacing:.16em;text-transform:lowercase;color:var(--brass)}
.pick-res .pn{font:400 28px/1.15 var(--display);margin:4px 0 6px}
.pick-res .pw{color:var(--muted);margin:0 0 14px}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.drink.flash{background:rgba(201,162,79,.14);transition:background .4s}
body:not(.board) .drink.hasph{grid-template-columns:1fr 76px}
body:not(.board) .drink .ph{grid-column:2;grid-row:1/span 3;width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);align-self:center}
.cardlink{display:inline-block;margin-top:14px;color:var(--brass);font:500 15px/1.3 var(--label);letter-spacing:.08em;text-decoration:none}
.drink .ph{display:none}
body:not(.board) .drink .ph{display:block}
.drink button{grid-row:1/span 3;grid-column:2}
body:not(.board) .drink .l{grid-column:1}
body:not(.board) .drink{align-items:start}
body:not(.board) .drink button{align-self:center}
.drink.signature button{grid-row:1/span 4}
.btn{border:1px solid var(--brass);background:transparent;color:var(--brass);font:700 14px/1 var(--label);letter-spacing:.12em;text-transform:lowercase;padding:11px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.btn:hover{background:rgba(201,162,79,.12)}
.btn.solid{background:var(--brass);color:#1a1408}
.btn.solid:hover{background:#d8b162}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.decaf{margin-top:14px;font-style:italic;color:var(--muted);font-size:15px}

/* Bean library */
.beans{display:flex;flex-direction:column;gap:14px}
.bean{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bean.out{opacity:.62}
.bean .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.bean h3{font:400 23px/1.15 var(--display);letter-spacing:.03em;margin:0}
.bean .by{font-style:italic;color:var(--muted);font-size:15px}
.pill{font:700 12px/1 var(--label);letter-spacing:.12em;text-transform:lowercase;padding:6px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.bar{color:var(--ok)}
.pill.press{color:var(--brass)}
.pill.out{color:var(--muted)}
#past h2{color:var(--muted)}
.beans.past .bean{opacity:.8}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font:500 12px/1.2 var(--label);letter-spacing:.12em;color:var(--brass);text-transform:lowercase}
.facts dd{margin:2px 0 0;font-size:15px}
.fresh{font-variant-numeric:tabular-nums}
.expect{margin:0;font-size:16px}
.take{margin:0;font:italic 400 17px/1.45 var(--italic);color:var(--ink);border-left:2px solid var(--oxblood);padding-left:12px}
.take .who{display:block;font:500 12px/1.4 var(--label);letter-spacing:.12em;color:var(--muted);font-style:normal;margin-top:2px}
.scales{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.scale span{display:block;font:500 12px/1.2 var(--label);letter-spacing:.1em;color:var(--muted);text-transform:lowercase;margin-bottom:5px}
.dots{display:flex;gap:4px}
.dots i{width:100%;height:6px;border-radius:2px;background:rgba(240,231,211,.12)}
.dots i.on{background:var(--brass)}
details.more summary{cursor:pointer;color:var(--brass);font:500 13px/1.2 var(--label);letter-spacing:.12em;text-transform:lowercase;list-style:none;padding-block:4px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
details.more .inner{display:flex;flex-direction:column;gap:10px}

/* Order form */
.order{background:var(--panel);border:1px solid var(--brass-dim);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field > label,.field > .legend{font:500 13px/1.2 var(--label);letter-spacing:.14em;color:var(--brass);text-transform:lowercase}
input[type=text],textarea{background:var(--ground);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;font-size:17px;width:100%}
textarea{resize:vertical;min-height:64px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice span{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:10px 15px;font-size:16px;min-height:44px;line-height:22px;cursor:pointer}
.choice input:checked + span{border-color:var(--brass);background:rgba(201,162,79,.16);color:var(--ink)}
.choice input:focus-visible + span{outline:2px solid var(--brass);outline-offset:2px}
.summary{border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.summary .what{font:400 22px/1.2 var(--display)}
.summary .how{color:var(--muted);font-size:15px}
.err{color:#e8a0a6;font-size:15px;margin:0}

.sent{background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.sent .big{font:400 30px/1.15 var(--display)}
.status-step{font:700 14px/1 var(--label);letter-spacing:.14em;text-transform:lowercase;color:var(--brass)}
.ticket{border:1px dashed var(--brass-dim);border-radius:6px;padding:14px 18px;width:100%;max-width:420px;text-align:left}
.ticket .who{font:400 24px/1.2 var(--display)}

/* Sticky order bar on the phone menu */
.orderbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--ground) 70%,rgba(15,28,22,0));display:flex;justify-content:center}
.orderbar .btn{width:100%;max-width:688px;min-height:52px;font-size:16px}

footer{color:var(--muted);text-align:center;font-size:14px;padding-block:28px 8px;font-style:italic}

/* ===== TV board ===== */
body.board{--u:min(1vw,1.7778vh);padding-block:0;overflow:hidden;font-size:clamp(16px,calc(1.35*var(--u)),26px);height:100vh}
.board-grid{display:grid;grid-template-columns:1.25fr 1.25fr .9fr;gap:calc(3*var(--u));padding:calc(2.5*var(--u)) calc(3*var(--u));height:calc(100vh - 10px);box-sizing:border-box}
.board-grid > div{min-width:0;display:flex;flex-direction:column;gap:calc(1.2*var(--u))}
.board h1{font:400 calc(4.4*var(--u))/1 var(--display);letter-spacing:.06em;margin:0}
.board .house{font:italic 400 calc(1.6*var(--u))/1.2 var(--italic);color:var(--brass)}
.board h2{font-size:calc(1.9*var(--u));color:var(--brass);margin:0}
.board .drinks .n{font-size:calc(1.6*var(--u))}
.board .drinks .l{font-size:calc(.95*var(--u))}
.board .drinks .d{display:none}
.board .drinks .n{white-space:nowrap}
.board .drinks .l{text-align:right}
.board .queue{overflow:hidden;min-height:0;flex:1 1 auto}
.board .drink{padding-block:calc(.2*var(--u))}
.bboard-bean{border-bottom:1px solid var(--rule);padding-bottom:calc(1*var(--u));display:flex;flex-direction:column;gap:calc(.3*var(--u))}
.bboard-bean h3{font:400 calc(1.8*var(--u))/1.15 var(--display);margin:0}
.bboard-bean .meta{font:500 calc(.95*var(--u))/1.3 var(--label);letter-spacing:.1em;color:var(--brass);text-transform:lowercase}
.bboard-bean p{margin:0;color:var(--muted);font-size:calc(1.1*var(--u))}
.qrbox{background:var(--ink);padding:calc(1*var(--u));border-radius:6px;align-self:flex-start}
.qrbox svg{display:block;width:calc(13*var(--u));height:calc(13*var(--u))}
.scan{font:italic 400 calc(1.5*var(--u))/1.3 var(--italic)}
.queue{display:flex;flex-direction:column;gap:calc(.6*var(--u))}
.q{display:flex;justify-content:space-between;gap:calc(1*var(--u));border-bottom:1px solid var(--rule);padding-bottom:calc(.5*var(--u))}
.q .nm{font:400 calc(1.5*var(--u))/1.2 var(--display)}
.q .dr{color:var(--muted);font-size:calc(1*var(--u))}
.q .st{white-space:nowrap;font:700 calc(.9*var(--u))/1 var(--label);letter-spacing:.12em;text-transform:lowercase;align-self:center}
.st.queued{color:var(--muted)}.st.making{color:var(--brass)}.st.ready{color:var(--ok)}
.wait{font:500 calc(1*var(--u))/1.3 var(--label);letter-spacing:.1em;color:var(--muted);text-transform:lowercase}

.boardnav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;background:rgba(15,28,22,.92);border:1px solid var(--rule);border-radius:999px;padding:8px 10px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.boardnav.show{opacity:1;pointer-events:auto}
.boardnav a,.boardnav button{color:var(--brass);background:none;border:0;font:700 13px/1 var(--label);letter-spacing:.12em;text-transform:lowercase;text-decoration:none;padding:8px 12px;cursor:pointer}
body.noorder{padding-bottom:32px}
.board .browse .qrbox svg{width:calc(17*var(--u));height:calc(17*var(--u))}
.board .browse .tagline{font:italic 400 calc(1.9*var(--u))/1.2 var(--italic);color:var(--brass);margin-top:calc(2*var(--u))}
.board .browse .tagline2{font:500 calc(1*var(--u))/1.2 var(--label);letter-spacing:.16em;text-transform:lowercase;color:var(--muted)}
/* ===== TV menu board (descriptive) ===== */
body.mb{display:flex;flex-direction:column}
.mb-head{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:calc(2.5*var(--u));padding:calc(1.2*var(--u)) calc(3*var(--u)) calc(.4*var(--u))}
.mb-crest{width:calc(8*var(--u));aspect-ratio:1;display:block;-webkit-mask-image:radial-gradient(circle,#000 66%,transparent 76%);mask-image:radial-gradient(circle,#000 66%,transparent 76%)}
.mb-tag{font:italic 400 calc(2.4*var(--u))/1.1 var(--italic);color:var(--brass)}
.mb-sub{font:500 calc(1*var(--u))/1.3 var(--label);letter-spacing:.14em;text-transform:lowercase;color:var(--muted);margin-top:calc(.6*var(--u))}
.mb-qr{display:flex;align-items:center;gap:calc(1.2*var(--u))}
.mb-qr .qrbox{padding:calc(.6*var(--u))}
.mb-qr .qrbox svg{width:calc(7*var(--u));height:calc(7*var(--u))}
.mb-scan{font:italic 400 calc(1.3*var(--u))/1.3 var(--italic);max-width:calc(10*var(--u))}
.mb-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:calc(3.5*var(--u));padding:0 calc(3*var(--u)) calc(1*var(--u));flex:1;min-height:0;overflow:hidden}
.mb h2{font-size:calc(1.8*var(--u));color:var(--brass);margin:0 0 calc(.3*var(--u))}
.mb-row{display:flex;justify-content:space-between;align-items:baseline;gap:calc(1*var(--u))}
.mb-drinks h2.mb-sub2{margin-top:calc(.8*var(--u))}
.board h2.sub2{margin-top:calc(.6*var(--u))}
.mb-dessert{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(2*var(--u));border-top:1px solid var(--rule)}
.mb-dz{border-bottom:1px solid var(--rule);padding:calc(.3*var(--u)) 0}
.mb-dz .n{font:400 calc(1.36*var(--u))/1.1 var(--display);letter-spacing:.03em;white-space:nowrap}
.mb-dz .l{font:500 calc(.78*var(--u))/1.3 var(--label);letter-spacing:.1em;color:var(--brass);text-transform:lowercase}
.bdessert{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(2*var(--u));border-top:1px solid var(--rule)}
.bdessert .n{font:400 calc(1.45*var(--u))/1.2 var(--display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--rule);padding:calc(.22*var(--u)) 0}
.mb-lately{font:500 calc(.7*var(--u))/1 var(--label);letter-spacing:.12em;text-transform:lowercase;color:var(--ink);background:var(--oxblood);border-radius:999px;padding:calc(.25*var(--u)) calc(.6*var(--u));margin-left:calc(.8*var(--u));vertical-align:middle;position:relative;top:calc(-.15*var(--u))}
.lately{font:500 11px/1 var(--label);letter-spacing:.12em;text-transform:lowercase;color:var(--ink);background:var(--oxblood);border-radius:999px;padding:4px 8px;margin-left:10px;vertical-align:middle;white-space:nowrap;display:inline-block;position:relative;top:-2px}
.mb-season{border-left:2px solid var(--oxblood);padding:calc(.4*var(--u)) 0 calc(.4*var(--u)) calc(1.4*var(--u));margin-right:calc(1*var(--u));max-width:calc(30*var(--u))}
.mb-season .k{font:500 calc(.8*var(--u))/1 var(--label);letter-spacing:.16em;text-transform:lowercase;color:var(--brass);margin-bottom:calc(.4*var(--u))}
.mb-season .sd{margin-top:calc(.3*var(--u))}
.mb-season .n{display:block;font:400 calc(1.45*var(--u))/1.1 var(--display);letter-spacing:.02em}
.mb-season .l{display:block;font:500 calc(.72*var(--u))/1.3 var(--label);letter-spacing:.08em;color:var(--muted);text-transform:lowercase}
.mb-drink{border-top:1px solid var(--rule);padding:calc(.1*var(--u)) 0}
.mb-drink .n{font:400 calc(1.36*var(--u))/1.1 var(--display);letter-spacing:.03em;white-space:nowrap}
.mb-drink .l{font:500 calc(.82*var(--u))/1.2 var(--label);letter-spacing:.1em;color:var(--brass);text-transform:lowercase;text-align:right}
.mb-drink .d{color:var(--muted);font-size:calc(.93*var(--u));line-height:1.2;margin-top:calc(.08*var(--u))}
.mb-bean{border-top:1px solid var(--rule);padding:calc(.6*var(--u)) 0 calc(.5*var(--u))}
.mb-bean h3{font:400 calc(1.75*var(--u))/1.1 var(--display);margin:0}
.mb-pill{font:700 calc(.75*var(--u))/1 var(--label);letter-spacing:.12em;text-transform:lowercase;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:calc(.35*var(--u)) calc(.7*var(--u))}
.mb-bean .meta{font:500 calc(.85*var(--u))/1.3 var(--label);letter-spacing:.1em;color:var(--brass);text-transform:lowercase;margin-top:calc(.3*var(--u))}
.mb-bean .meta2{font:500 calc(.8*var(--u))/1.3 var(--label);letter-spacing:.1em;color:var(--muted);text-transform:lowercase}
.mb-bean .notes{font-size:calc(1.08*var(--u));margin-top:calc(.35*var(--u))}
.mb-bean .k{font:500 calc(.78*var(--u))/1 var(--label);letter-spacing:.12em;text-transform:lowercase;color:var(--brass)}
.mb-bean .expect{margin:calc(.35*var(--u)) 0 0;font-size:calc(1.05*var(--u));line-height:1.35;color:var(--ink)}
.mb-bean .take{margin:calc(.35*var(--u)) 0 0;font:italic 400 calc(1.1*var(--u))/1.3 var(--italic);color:var(--muted);border-left:2px solid var(--oxblood);padding-left:calc(.8*var(--u))}
.mb-bean .take .k{font-style:normal}
/* ===== Bar view ===== */
.alertbtn{margin:0 0 14px}
.newbanner{position:fixed;inset:auto 16px 20px 16px;background:var(--brass);color:#1a1408;border-radius:10px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;flex-direction:column;gap:4px;z-index:20;cursor:pointer;font-size:18px}
body.board .newbanner{inset:auto calc(25*var(--u)) calc(3*var(--u)) calc(25*var(--u));padding:calc(1.6*var(--u)) calc(2*var(--u));font-size:calc(1.6*var(--u))}
body.board .newbanner .nb-name{font-size:calc(3.2*var(--u))}
.boardnav .alertbtn{margin:0}
.newbanner.show{display:flex;animation:pulse 1s ease-in-out 3}
.newbanner .label{color:#1a1408}
.newbanner .nb-name{font:400 30px/1.1 var(--display)}
.newbanner .nb-tap{font:700 12px/1 var(--label);letter-spacing:.12em;text-transform:lowercase;opacity:.7;margin-top:6px}
@keyframes pulse{50%{transform:scale(1.02)}}

}

<body>
<div class="tartan" aria-hidden="true"></div>
<div id="app" class="wrap"></div>

<script src="qrcode.js"></script>
<script src="data.js"></script>
<script src="guest.js"></script>
<script src="../data/shots.js" onerror="window.SHOTS=[]"></script>
<script>
(function(){
"use strict";
const M = window.FOREUNDER;
const NTFY = "https://ntfy.sh";
const ORDERS = M.ntfyTopic;
const STATUS = M.ntfyTopic + "-status";
const app = document.getElementById("app");

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; n.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return n;
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){ if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); return MONTHS[m-1] + " " + d; }
function daysSince(iso){ if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); const then = new Date(y,m-1,d); const now = new Date(); now.setHours(0,0,0,0); return Math.round((now - then)/86400000); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function agoText(sec){ const m = Math.max(0, Math.round((Date.now()/1000 - sec)/60)); return m < 1 ? "just now" : m + " min ago"; }
const STATUS_LABEL = { queued:"in the queue", making:"being made", ready:"ready to pick up" };

const beanById = Object.fromEntries(M.beans.map(b => [b.id, b]));
const onBar = M.beans.filter(b => b.status === "bar");
const pressBeans = M.beans.filter(b => b.status === "press");
function beansFor(drink){ return drink.uses === "espresso" ? onBar : drink.uses === "press" ? pressBeans : []; }

function freshness(b){
  if (b.roastDate){ const d = daysSince(b.roastDate); return "Roasted " + fmtDate(b.roastDate) + " · " + d + " days off roast"; }
  if (b.opened) return "Bag opened " + fmtDate(b.opened) + " · roast date not on the bag";
  return null;
}
function dots(n){ const w = el("div",{class:"dots","aria-hidden":"true"}); for(let i=1;i<=5;i++) w.append(el("i",{class: i<=n ? "on" : null})); return w; }

/* ---------- live order stream (ntfy) ---------- */
// One SSE connection carries both topics: orders and status changes. ntfy caches 12 hours.
const orders = new Map();   // id -> {id,time,name,what,note}
const states = new Map();   // id -> {state,time}
let listeners = [];
let es = null, connected = false;
function emit(){ listeners.forEach(f => f()); }
function ingest(m){
  if (!m || m.event !== "message") return;
  if (m.topic === ORDERS){
    if (orders.has(m.id)) return;
    if (!(m.tags || []).includes("coffee")) return; // only orders sent from the menu
    const lines = String(m.message||"").split("\n");
    orders.set(m.id, { id:m.id, time:m.time, name:m.title || "Guest", what:lines[0] || "", note:(lines.slice(1).join(" ").replace(/^Note:\s*/,"")) });
  } else if (m.topic === STATUS){
    let s; try{ s = JSON.parse(m.message); }catch(e){ return; }
    if (!s || !s.id || !STATUS_LABEL[s.state]) return;
    const prev = states.get(s.id);
    if (!prev || prev.time <= m.time) states.set(s.id, { state:s.state, time:m.time });
  }
}
function connect(){
  if (es) return;
  const url = NTFY + "/" + ORDERS + "," + STATUS + "/sse?since=12h";
  try{
    es = new EventSource(url);
    es.onopen = () => { connected = true; emit(); };
    es.onmessage = ev => { try{ ingest(JSON.parse(ev.data)); emit(); }catch(e){} };
    es.onerror = () => { connected = false; emit(); };
  }catch(e){ connected = false; emit(); }
}
function stateOf(id){ return (states.get(id) || {state:"queued"}).state; }
function activeQueue(){ return [...orders.values()].filter(o => stateOf(o.id) !== "ready" || (Date.now()/1000 - (states.get(o.id)||{}).time) < 600).sort((a,b) => a.time - b.time); }

async function publish(topic, title, message){
  // No Content-Type header: keeps this a simple CORS request. ntfy reads JSON posted to its root.
  const res = await fetch(NTFY + "/", { method:"POST", body: JSON.stringify(Object.assign({ topic, title, message, tags:["coffee"] }, topic === ORDERS ? { priority:4 } : {})) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ---------- PHONE MENU ---------- */
// Ordering is off: the menu is for browsing, and Jamey serves everyone in the room.
// Set ordering: true in data.js to bring back phone ordering, the order screen and the TV queue.
// Two versions of the same site: the simple menu (default) and the ordering version (?order).
// Each has its own QR code, so the table card decides which one guests get. ?test works the same as ?order.
const ORDER_MODE = /[?&](order|test)\b/.test(location.search);
const ORDERING = M.ordering === true || ORDER_MODE;
const MODE_QS = ORDER_MODE ? "?order" : "";
const QR_URL = M.siteUrl + (ORDERING && M.ordering !== true ? "?order" : "");
const SCAN_LINE = ORDERING ? "Scan to see our coffees and order." : "Scan to see our coffees.";

function renderMenu(){
  document.body.className = "";
  app.replaceChildren();
  app.append(
    el("header",{class:"crest"},
      el("img",{class:"logo",src:"logo.jpg",alt:"Foreunder Coffee House crest: crossed golf clubs, a steaming cup and a thistle"}),
      el("h1",{class:"sr",text:"Foreunder Coffee House"}),
      el("div",{class:"est",text:"est. 2026"}),
      el("div",{class:"rule"})
    )
  );

  // Drinks
  const lately = notMadeLately(3);
  const list = el("ul",{class:"drinks"});
  const dessertList = el("ul",{class:"drinks"});
  const seasonList = el("ul",{class:"drinks"});
  M.drinks.forEach(d => {
    const available = d.uses === "none" || beansFor(d).length > 0;
    if (!available) return;
    (d.section === "dessert" ? dessertList : d.section === "seasonal" ? seasonList : list).append(el("li",{class:"drink" + (d.signature ? " signature" : "") + (d.photo && !ORDERING ? " hasph" : ""), id:"d-" + d.id},
      d.photo && !ORDERING ? el("img",{class:"ph",src:d.photo,alt:d.name + " made at the Foreunder bar",loading:"lazy"}) : null,
      d.signature ? el("div",{class:"sig",text:"house signature"}) : null,
      el("div",{class:"n"}, d.name, lately.has(d.id) ? el("span",{class:"lately",text:"not made lately"}) : null),
      el("div",{class:"l",text:d.line}),
      el("div",{class:"d",text:d.note}),
      ORDERING ? el("button",{class:"btn",type:"button","aria-label":"Order a " + d.name,onclick:()=>openOrder(d.id),text:"order"}) : null
    ));
  });
  app.append(el("section",{id:"drinks"},
    el("h2",{text:"Drinks"}),
    el("p",{class:"sub",text:"Every espresso drink is a double shot, pulled to order."}),
    picker(),
    list,
    el("p",{class:"decaf",text:M.decafNote}),
    window.GUEST && window.GUEST.on ? el("a",{class:"cardlink",href:"share.html" + MODE_QS},"Got a good-looking cup? Share your pour ›") : null
  ));
  if (seasonList.children.length) app.append(el("section",{id:"seasonal"},
    el("h2",{text:(M.season && M.season.name ? M.season.name + " Seasonal" : "Seasonal")}),
    M.season && M.season.sub ? el("p",{class:"sub",text:M.season.sub}) : null,
    seasonList
  ));
  if (dessertList.children.length) app.append(el("section",{id:"dessert"},
    el("h2",{text:"Dessert"}),
    dessertList
  ));

  // Beans
  const beansWrap = el("div",{class:"beans"});
  M.beans.filter(b => b.status !== "out").sort((a,b) => ({bar:0,press:1}[a.status] - {bar:0,press:1}[b.status])).forEach(b => beansWrap.append(beanCard(b)));
  app.append(el("section",{id:"beans"},
    el("h2",{text:"Our coffees"}),
    el("p",{class:"sub",text:"On hand now: where each one is from and what to expect."}),
    beansWrap,
    el("a",{class:"cardlink",href:"scorecard.html" + MODE_QS},"See the scorecard: how every coffee played ›")
  ));
  // Coffees we've finished: kept for the record, clearly not available.
  const past = M.beans.filter(b => b.status === "out");
  if (past.length){
    const pastWrap = el("div",{class:"beans past"});
    past.forEach(b => pastWrap.append(beanCard(b)));
    app.append(el("section",{id:"past"},
      el("h2",{text:"Coffees we've tried"}),
      el("p",{class:"sub",text:"Past bags we've brewed and enjoyed. Not on hand right now."}),
      pastWrap
    ));
  }

  if (!ORDERING){
    app.append(el("footer",null, el("a",{href:"about.html" + MODE_QS,text:"Why a thistle? Read our story"}), el("div",{text:"Foreunder · Omaha, Nebraska"})));
    document.body.classList.add("noorder");
    return;
  }
  // Order
  app.append(el("section",{id:"order"}, el("h2",{text:"Place your order"}), el("p",{class:"sub",text:"Pick a drink and a bean. Your order goes straight to Jamey."}), orderForm()));

  app.append(el("footer",null, el("a",{href:"about.html" + MODE_QS,text:"Why a thistle? Read our story"}), el("div",{text:"Foreunder · Omaha, Nebraska"})));
  const bar = el("div",{class:"orderbar"}, el("button",{class:"btn solid",type:"button",onclick:()=>openOrder(),text:"order a drink"}));
  app.append(bar);
  // Hide the floating button once the order form is on screen.
  if ("IntersectionObserver" in window){
    new IntersectionObserver(es => { bar.hidden = es[0].isIntersecting; }, {rootMargin:"0px 0px -30% 0px"}).observe(document.getElementById("order"));
  }
}

function beanCard(b){
  const pillText = { bar:"available", press:"french press only", out:"not on hand" }[b.status];
  const facts = el("dl",{class:"facts"});
  const add = (k,v) => { if (v) facts.append(el("div",null, el("dt",{text:k}), el("dd",{text:v}))); };
  add("origin", b.origin);
  add("process", b.process);
  add("roast", b.roastLevel);
  add("type", b.type);
  const fr = b.status !== "out" ? freshness(b) : null;

  const card = el("article",{class:"bean" + (b.status === "out" ? " out" : "")},
    el("div",{class:"top"},
      el("div",null, el("h3",{text:b.name}), el("div",{class:"by",text:b.roaster + (b.roasterCity ? " · " + b.roasterCity : "")})),
      el("span",{class:"pill " + b.status,text:pillText})
    ),
    fr ? el("div",{class:"label fresh",text:fr}) : null,
    b.roasterNotes ? el("p",{class:"expect"}, el("span",{class:"label",text:"roaster's notes  "}), b.roasterNotes) : null,
    b.status !== "out" && b.expect ? el("p",{class:"expect",text:b.expect}) : null,
    b.take ? el("p",{class:"take"}, b.take, el("span",{class:"who",text:"jamey's take"})) : null
  );
  if (b.status !== "out"){
    const more = el("details",{class:"more"}, el("summary",{text:"the details"}),
      el("div",{class:"inner"},
        facts,
        el("div",{class:"scales"},
          el("div",{class:"scale"}, el("span",{text:"body"}), dots(b.scale.body)),
          el("div",{class:"scale"}, el("span",{text:"acidity"}), dots(b.scale.acidity)),
          el("div",{class:"scale"}, el("span",{text:"roast"}), dots(b.scale.roast))
        ),
        b.bestFor ? el("div",{class:"facts"}, el("div",null, el("dt",{text:"best for"}), el("dd",{text:b.bestFor.join(", ")}))) : null,
        b.recipe ? el("div",{class:"facts"}, el("div",null, el("dt",{text:"jamey's recipe"}), el("dd",{text:b.recipe}))) : null
      )
    );
    card.append(more);
  }
  return card;
}

/* order form */
const draft = { name: store("fu-name") || "", drink:null, bean:null, milk:null, choc:null, serve:"Hot", note:"" };
let formEl = null;

function radios(name, options, current, onpick){
  const wrap = el("div",{class:"choices",role:"radiogroup"});
  options.forEach((o,i) => {
    const id = name + "-" + i;
    const inp = el("input",{type:"radio",name,id,value:o.value,checked:o.value === current});
    inp.addEventListener("change", () => onpick(o.value));
    wrap.append(el("label",{class:"choice",for:id}, inp, el("span",{text:o.label})));
  });
  return wrap;
}

function orderForm(){
  formEl = el("form",{class:"order",id:"order-form",novalidate:true});
  formEl.addEventListener("submit", e => { e.preventDefault(); sendOrder(); });
  drawForm();
  return formEl;
}

function drawForm(){
  if (!formEl) return;
  const drinks = M.drinks.filter(d => d.uses === "none" || beansFor(d).length);
  const drink = drinks.find(d => d.id === draft.drink) || null;
  const beans = drink ? beansFor(drink) : [];
  if (drink && beans.length && !beans.find(b => b.id === draft.bean)) draft.bean = beans[0].id;
  if (drink && !beans.length) draft.bean = null;
  if (drink && drink.milk && !draft.milk) draft.milk = M.milks[0];
  if (drink && drink.chocolate && !draft.choc) draft.choc = M.chocolates[0];
  if (drink && !drink.iced) draft.serve = "Hot";

  const nameIn = el("input",{type:"text",id:"guest-name",maxlength:"24",autocomplete:"given-name",placeholder:"First name",value:draft.name});
  nameIn.addEventListener("input", () => { draft.name = nameIn.value; drawSummary(); });
  const noteIn = el("textarea",{id:"guest-note",maxlength:"120",placeholder:"Anything else? Extra hot, less milk, a second cup…"});
  noteIn.value = draft.note;
  noteIn.addEventListener("input", () => { draft.note = noteIn.value; });

  formEl.replaceChildren(...[
    el("div",{class:"field"}, el("label",{for:"guest-name",text:"your name"}), nameIn),
    el("div",{class:"field"}, el("div",{class:"legend",text:"drink"}),
      radios("drink", drinks.map(d => ({value:d.id,label:d.name})), draft.drink, v => { draft.drink = v; drawForm(); })),
    beans.length ? el("div",{class:"field"}, el("div",{class:"legend",text:"beans"}),
      radios("bean", beans.map(b => ({value:b.id,label:b.name})), draft.bean, v => { draft.bean = v; drawSummary(); })) : null,
    drink && drink.milk ? el("div",{class:"field"}, el("div",{class:"legend",text:"milk"}),
      radios("milk", M.milks.map(m => ({value:m,label:m})), draft.milk, v => { draft.milk = v; drawSummary(); })) : null,
    drink && drink.chocolate ? el("div",{class:"field"}, el("div",{class:"legend",text:"chocolate"}),
      radios("choc", M.chocolates.map(c => ({value:c,label:c})), draft.choc, v => { draft.choc = v; drawSummary(); })) : null,
    drink && drink.iced ? el("div",{class:"field"}, el("div",{class:"legend",text:"serve"}),
      radios("serve", [{value:"Hot",label:"Hot"},{value:"Iced",label:"Iced"}], draft.serve, v => { draft.serve = v; drawSummary(); })) : null,
    el("div",{class:"field"}, el("label",{for:"guest-note",text:"note for jamey (optional)"}), noteIn),
    el("div",{class:"summary",id:"order-summary"}),
    el("p",{class:"err",id:"order-err",hidden:true}),
    el("button",{class:"btn solid",type:"submit",id:"send-btn",text:"send order"})
  ].filter(Boolean));
  drawSummary();
}

function orderLine(){
  const d = M.drinks.find(x => x.id === draft.drink);
  if (!d) return null;
  const parts = [ (draft.serve === "Iced" ? "Iced " : "") + d.name ];
  if (draft.bean) parts.push(beanById[draft.bean].name);
  if (d.milk && draft.milk) parts.push(draft.milk);
  if (d.chocolate && draft.choc) parts.push(draft.choc);
  return parts;
}
function drawSummary(){
  const s = document.getElementById("order-summary");
  if (!s) return;
  const parts = orderLine();
  s.replaceChildren(
    el("div",{class:"label",text:"your order"}),
    el("div",{class:"what",text: parts ? parts[0] : "Choose a drink"}),
    el("div",{class:"how",text: parts ? parts.slice(1).join(" · ") || "Straight up" : "Then pick your beans."})
  );
  const btn = document.getElementById("send-btn");
  if (btn) btn.disabled = !(parts && draft.name.trim());
}

function openOrder(drinkId){
  if (drinkId){ draft.drink = drinkId; drawForm(); }
  const target = document.getElementById("order");
  if (target) target.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  setTimeout(() => { const n = document.getElementById(draft.name ? "send-btn" : "guest-name"); if (n) n.focus({preventScroll:true}); }, 400);
}

async function sendOrder(){
  const parts = orderLine();
  const name = draft.name.trim().slice(0,24);
  const err = document.getElementById("order-err");
  if (!parts || !name){ err.textContent = "Add your name and choose a drink."; err.hidden = false; return; }
  store("fu-name", name);
  const line = parts.join(" · ");
  const note = draft.note.trim().slice(0,120);
  const btn = document.getElementById("send-btn");
  btn.disabled = true; btn.textContent = "sending…";
  unlockChime();
  try{
    const res = await publish(ORDERS, name, line + (note ? "\nNote: " + note : ""));
    showSent(res.id, name, line, note, true);
  }catch(e){
    showSent(null, name, line, note, false);
  }
}

/* Ready alert: iPhones only allow sound after a tap, so the "send order" tap unlocks it. */
let chimeCtx = null;
function unlockChime(){ try{ chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)(); chimeCtx.resume(); const o = chimeCtx.createOscillator(), g = chimeCtx.createGain(); g.gain.value = 0; o.connect(g).connect(chimeCtx.destination); o.start(); o.stop(chimeCtx.currentTime + .01); }catch(e){} }
function orderChime(){
  try{
    if (!chimeCtx) return;
    chimeCtx.resume();
    [0, .18, .36, .9, 1.08, 1.26].forEach((t,i) => { const o = chimeCtx.createOscillator(), g = chimeCtx.createGain(); o.type = "triangle"; o.frequency.value = [1047, 1319, 1568][i % 3]; const at = chimeCtx.currentTime + t; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.35, at + .02); g.gain.exponentialRampToValueAtTime(.001, at + .5); o.connect(g).connect(chimeCtx.destination); o.start(at); o.stop(at + .55); });
  }catch(e){}
}
function readyAlert(){
  try{
    if (chimeCtx){ chimeCtx.resume(); [0, .22, .44].forEach((t,i) => { const o = chimeCtx.createOscillator(), g = chimeCtx.createGain(); o.type = "sine"; o.frequency.value = [784, 988, 1175][i]; const at = chimeCtx.currentTime + t; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.25, at + .02); g.gain.exponentialRampToValueAtTime(.001, at + .6); o.connect(g).connect(chimeCtx.destination); o.start(at); o.stop(at + .65); }); }
  }catch(e){}
  try{ if (navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  document.title = "☕ Your drink is ready · Foreunder";
}

function showSent(id, name, line, note, ok){
  const section = document.getElementById("order");
  const status = el("div",{class:"status-step",id:"my-status",text: ok ? "in the queue" : "show this to jamey"});
  section.replaceChildren(
    el("div",{class:"sent"},
      el("div",{class:"label",text: ok ? "order sent" : "order didn't send"}),
      el("div",{class:"big",text: ok ? "Thanks, " + name + "." : "Show Jamey this ticket"}),
      status,
      ok ? el("p",{class:"sub",id:"keep-open",text:"Keep this page open. It will chime when your drink is ready."}) : null,
      el("div",{class:"ticket"}, el("div",{class:"who",text:name}), el("div",{text:line}), note ? el("div",{class:"by",text:note}) : null),

// "Help me pick": three quick taps that point a guest to a drink Jamey makes well.
function picker(){
  const has = id => M.drinks.some(d => d.id === id && (d.uses === "none" || beansFor(d).length));
  const pickFrom = ids => ids.find(has);
  const wrap = el("div",{class:"picker"});
  const ans = {};
  const Q = [
    {k:"style", q:"How do you like your coffee?", o:[["bold","Strong and bold"],["mellow","Smooth and mellow"],["none","No coffee for me"]]},
    {k:"milk", q:"Milk?", o:[["black","None, keep it black"],["little","Just a little"],["lots","Creamy and milky"]]},
    {k:"sweet", q:"Something sweet?", o:[["yes","Yes, treat me"],["no","No thanks"]]}
  ];
  function result(){
    if (ans.style === "none") return [pickFrom(["hotchoc"]), "Rich dark chocolate, no coffee at all."];
    if (ans.milk === "black") return ans.style === "bold"
      ? [pickFrom(["espresso","americano"]), "The purest taste of the coffee."]
      : [pickFrom(["americano","press","espresso"]), "Long, clean and easy to sip."];
    if (ans.sweet === "yes") return [pickFrom(["mocha","latte"]), "Espresso, real dark chocolate and steamed milk."];
    if (ans.milk === "little") return ans.style === "bold"
      ? [pickFrom(["flatwhite","cappuccino"]), "Strong coffee softened with silky milk. The house favorite."]
      : [pickFrom(["groundscrew","flatwhite"]), "A long Americano with a rich cap of steamed cream."];
    return ans.style === "bold"
      ? [pickFrom(["cappuccino","flatwhite"]), "A strong double under a thick cap of foam."]
      : [pickFrom(["latte","flatwhite"]), "Milder and milkier, easy any time of day."];
  }
  function step(i){
    wrap.replaceChildren();
    if (i === 0) delete ans.milk, delete ans.sweet;
    const qs = Q.filter(q => !(q.k !== "style" && ans.style === "none") && !(q.k === "sweet" && ans.milk === "black"));
    if (i >= qs.length){
      const [id, why] = result(); const d = M.drinks.find(x => x.id === id);
      if (!d) { wrap.append(el("p",{class:"pq",text:"Ask Jamey. He'll sort you out."})); return; }
      wrap.append(el("div",{class:"pick-res"},
        el("div",{class:"pk",text:"Try the"}),
        el("div",{class:"pn",text:d.name}),
        el("p",{class:"pw",text:why}),
        el("div",{class:"pbtns"},
          ORDERING ? el("button",{class:"btn solid",type:"button",onclick:()=>openOrder(d.id),text:"order it"})
                   : el("button",{class:"btn",type:"button",onclick:()=>{ const t=document.getElementById("d-"+d.id); if(t){ t.scrollIntoView({behavior:"smooth",block:"center"}); t.classList.add("flash"); setTimeout(()=>t.classList.remove("flash"),1800);} },text:"show me"}),
          el("button",{class:"btn ghost",type:"button",onclick:()=>step(0),text:"start over"}))
      ));
      return;
    }
    const q = qs[i];
    wrap.append(el("p",{class:"pq",text:q.q}),
      el("div",{class:"pbtns"}, ...q.o.map(([v,label]) => el("button",{class:"btn",type:"button",onclick:()=>{ ans[q.k]=v; step(i+1); },text:label}))),
      el("div",{class:"pdots",text: (i+1) + " of " + qs.length}));
  }
  const start = el("button",{class:"btn pickstart",type:"button",onclick:()=>{ start.remove(); wrap.hidden=false; step(0); },text:"Not sure? Help me pick"});
  wrap.hidden = true;
  return el("div",{class:"pickbox"}, start, wrap);
}

// "Not made lately": reads the Shot Log mirror and flags the everyday espresso drinks made least recently.
const DRINK_MATCH = [
  ["groundscrew", /grounds crew|swilcan/i], ["mocha", /mocha/i], ["flatwhite", /flat white/i],
  ["cappuccino", /cappuccino/i], ["cortado", /cortado/i], ["macchiato", /macchiato/i],
  ["americano", /americano/i], ["latte", /\blatte\b(?! art)/i], ["espresso", /straight espresso|^espresso\b/i]
];
function notMadeLately(n){
  const last = {};
  (window.SHOTS || []).forEach(sh => {
    const hit = DRINK_MATCH.find(([, re]) => re.test(sh.drink || ""));
    if (hit && sh.date && (!last[hit[0]] || sh.date > last[hit[0]])) last[hit[0]] = sh.date;
  });
  if (!Object.keys(last).length) return new Set();
  const pool = M.drinks.filter(d => d.uses === "espresso" && !d.section && d.tv !== false && beansFor(d).length);
  pool.sort((a, b) => (last[a.id] || "") < (last[b.id] || "") ? -1 : (last[a.id] || "") > (last[b.id] || "") ? 1 : 0);
  return new Set(pool.slice(0, n).map(d => d.id));
}

/* New-order alerts (order screen and TV board): chime + vibration + banner + tab title.
   Browsers only allow sound after a click or tap, so a button unlocks it. */
function attachOrderAlerts(host, label){
  const alertBtn = el("button",{class:"btn solid alertbtn",type:"button",text:label});
  alertBtn.addEventListener("click", () => { unlockChime(); orderChime(); alertBtn.textContent = "order sound on"; alertBtn.disabled = true; alertBtn.classList.add("on"); });
  const banner = el("div",{class:"newbanner",role:"alert"});
  const baseTitle = document.title;
  let hideT;
  const hide = () => { banner.classList.remove("show"); document.title = baseTitle; };
  banner.addEventListener("click", hide);
  host.append(alertBtn);
  document.body.append(banner);
  const loadedAt = Date.now()/1000 - 5, seen = new Set();
  listeners.push(() => {
    for (const o of orders.values()){
      if (seen.has(o.id)) continue;
      seen.add(o.id);
      if (o.time < loadedAt) continue;          // history replayed on connect: no alert
      orderChime();
      try{ if (navigator.vibrate) navigator.vibrate([300,150,300]); }catch(e){}
      banner.replaceChildren(el("div",{class:"label",text:"new order"}), el("div",{class:"nb-name",text:o.name}), el("div",{text:o.what}), el("div",{class:"nb-tap",text:"tap to dismiss"}));
      banner.classList.add("show");
      document.title = "🔔 New order: " + o.name;
      clearTimeout(hideT); hideT = setTimeout(hide, 60000);
    }
  });
  return alertBtn;
}

  app.append(

    el("label",{for:"show-ready",class:"label",style:"display:flex;gap:8px;align-items:center;margin-bottom:12px"}, showAll, "show ready orders"),
  );
  attachOrderAlerts(app, "turn on order sound");
  const box = el("div",{class:"tickets"});
  app.append(box,
    el("div",{class:"help"},
      el("p",null,"Keep this screen open and tap \u201cturn on order sound\u201d each time you open it. Optional phone alerts: the free ntfy app, topic ", el("code",{text:ORDERS}), "."),
      el("p",null,"Ordering menu: ", el("code",{text:QR_URL}), " · TV board: ", el("code",{text:QR_URL + "#board"}))
    )
  );
  showAll.addEventListener("change", draw);
  connect();
  async function setState(id, state, btn){
    btn.disabled = true;
    try{ await publish(STATUS, "status", JSON.stringify({id, state})); }
    catch(e){ btn.disabled = false; btn.textContent = "retry"; }
  }
  function draw(){
    conn.textContent = connected ? "live" : "reconnecting…";
    conn.className = "conn " + (connected ? "on" : "off");
    const all = [...orders.values()].sort((a,b) => a.time - b.time);
    const rows = all.filter(o => showAll.checked || stateOf(o.id) !== "ready");
    box.replaceChildren(...(rows.length ? rows.map(o => {
      const st = stateOf(o.id);
      return el("div",{class:"bt " + st},
        el("div",{class:"who",text:o.name}),
        el("div",{class:"what",text:o.what}),
        o.note ? el("div",{class:"note",text:o.note}) : null,
        el("div",{class:"ago",text:agoText(o.time) + " · " + STATUS_LABEL[st]}),
        el("div",{class:"acts"},
          st === "queued" ? el("button",{class:"btn",type:"button",text:"making",onclick:e=>setState(o.id,"making",e.currentTarget)}) : null,
          st !== "ready" ? el("button",{class:"btn solid",type:"button",text:"ready",onclick:e=>setState(o.id,"ready",e.currentTarget)}) : null
        )
      );
    }) : [el("div",{class:"empty",text:"No open orders."})]));
  }
  listeners.push(draw); draw();
  setInterval(draw, 30000);
  keepAwake();
}

function makeQR(node){
  if (typeof qrcode !== "function"){ node.append(el("div",{style:"color:#111;font-size:14px;max-width:200px",text:QR_URL})); return; }
  const q = qrcode(0, "M"); q.addData(QR_URL); q.make();
  node.innerHTML = q.createSvgTag({cellSize:8, margin:0, scalable:true}).replace(/fill="white"/g,'fill="#f0e7d3"').replace(/fill="black"/g,'fill="#0f1c16"');
}
async function keepAwake(){ try{ if (navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && /board|bar|table/.test(location.hash)) keepAwake(); });

/* ---------- router ---------- */
function route(){
  listeners = [];
  const h = location.hash.replace("#","");
  if (h === "board") renderBoard();
  else if (h === "bar" && ORDERING) renderBar();
  else if (h === "table") renderTable();
  else { renderMenu(); if (h === "order" && ORDERING) openOrder(); }
}
window.addEventListener("hashchange", () => location.reload());
route();
})();
