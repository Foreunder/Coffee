<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreunder Pub Quiz</title>
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
:root{--strip:calc(5.4*min(1vw,1.78vh));--ground:#0f1c16;--panel:#16271f;--ink:#f0e7d3;--muted:#b9ad90;--brass:#c9a24f;--oxblood:#8a2a35;--rule:rgba(201,162,79,.28);
  --u:min(1vw,1.78vh);--A:#c9a24f;--B:#a8424f;--C:#4f8a6a;--D:#5a7499}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font:calc(1.6*var(--u))/1.35 "Alegreya",Georgia,serif;-webkit-font-smoothing:antialiased}
.band{height:calc(1.4*var(--u));flex:none;background:repeating-linear-gradient(45deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,transparent 0 10px,rgba(122,36,48,.78) 10px 17px,transparent 17px 19px,rgba(201,162,79,.9) 19px 20px,transparent 20px 22px,rgba(122,36,48,.78) 22px 29px,transparent 29px 38px,rgba(5,10,8,.55) 38px 46px,transparent 46px 48px),repeating-linear-gradient(0deg,transparent 0 10px,rgba(122,36,48,.78) 10px 17px,transparent 17px 19px,rgba(201,162,79,.9) 19px 20px,transparent 20px 22px,rgba(122,36,48,.78) 22px 29px,transparent 29px 38px,rgba(5,10,8,.55) 38px 46px,transparent 46px 48px),#1b3a2a;box-shadow:inset 0 -1px 0 rgba(201,162,79,.55)}
#app{position:absolute;inset:calc(.6*var(--u)) 0 var(--strip) 0;display:flex;flex-direction:column;padding:calc(2*var(--u)) calc(3.5*var(--u)) calc(1.2*var(--u))}
.k{font:500 calc(1.1*var(--u))/1 "Alegreya Sans SC",sans-serif;letter-spacing:.16em;text-transform:lowercase;color:var(--brass)}
h1{font:400 calc(4.6*var(--u))/1 "IM Fell English SC",Georgia,serif;letter-spacing:.03em;margin:0}
.it{font:italic 400 calc(2*var(--u))/1.25 "IM Fell English",Georgia,serif;color:var(--brass)}
/* lobby */
.lobby > *{min-width:0}
.lobby{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:calc(4*var(--u));flex:1;min-height:0}
.brand{display:flex;align-items:center;gap:calc(2*var(--u));margin-bottom:calc(1.6*var(--u))}
.brand img{height:calc(9*var(--u));width:auto}
.join{display:flex;gap:calc(2.5*var(--u));align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:calc(1.2*var(--u));padding:calc(2*var(--u))}
.qr{background:var(--ink);padding:calc(1*var(--u));border-radius:calc(.6*var(--u))}
.qr svg{display:block;width:calc(16*var(--u));height:calc(16*var(--u))}
.code{font:400 calc(6*var(--u))/1 "IM Fell English SC",Georgia,serif;letter-spacing:.18em;color:var(--brass)}
.steps{margin:calc(1*var(--u)) 0 0;padding-left:calc(2.2*var(--u));font-size:calc(1.5*var(--u))}
.steps li{margin:calc(.4*var(--u)) 0}
.settings{display:flex;gap:calc(1*var(--u));flex-wrap:wrap;margin-top:calc(2*var(--u))}
.conn-banner{position:fixed;top:0;left:0;right:0;z-index:100;background:#8a2a35;color:#f0e7d3;text-align:center;padding:8px 12px;font:500 14px/1.3 "Alegreya Sans SC",sans-serif;letter-spacing:.08em;display:none}
.conn-banner.show{display:block}
</style>
</head>
<body>
<div id="conn-banner" class="conn-banner">Connection lost — reconnecting…</div>
<div id="app"></div>
<script src="../data.js"></script>
<script src="../qrcode.js"></script>
<script src="mqtt.min.js"></script>
<script src="quiz.js"></script>
<script src="courses.js"></script>
<script src="sounds.js"></script>
<script src="questions.js"></script>
<script src="otdb.js"></script>
<script src="family.js"></script>
<script>
// Connection status banner watcher added
setInterval(function(){
  var b = document.getElementById("conn-banner");
  if (!b) return;
  if (window.PQ && typeof PQ.isUp === "function" && !PQ.isUp()) {
    var err = PQ.lastError ? PQ.lastError() : null;
    b.textContent = err ? "Connection lost — " + err : "Connection lost — reconnecting…";
    b.classList.add("show");
  } else {
    b.classList.remove("show");
  }
}, 1500);
</script>
</body>
</html>
