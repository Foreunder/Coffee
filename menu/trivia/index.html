<script>

  var LENS = [["9", 9, false], ["9b", 9, true], ["18", 18, false], ["72", 72, false]];
  function lenKey(){ return S.holes === 9 ? (S.back ? "9b" : "9") : String(S.holes); }
  function OFF(){ return S.holes === 9 && S.back ? 9 : 0; }

  // ---- game state (lives only on the TV) ----
  var S = { phase: "boot", mode: PQ.store("foreunder.quiz.mode") === "solo" ? "solo" : "teams", holes: HOLE_OPTS.indexOf(Number(PQ.store("foreunder.quiz.holes"))) !== -1 ? Number(PQ.store("foreunder.quiz.holes")) : 9, preset: PQ.store("foreunder.quiz.preset") || "pub", course: PQ.store("foreunder.quiz.course") || "foreunder", hcp: PQ.store("foreunder.quiz.hcp") === "1", back: PQ.store("foreunder.quiz.back") === "1", diff: PQ.store("foreunder.quiz.diff") || "mixed", cats: storedCats(), qs: [], i: -1, teams: {}, players: {}, answers: {}, gone: [], endsAt: 0, qStart: 0, room: "", err: "" };
  var timer = null, elimTimers = [];

  var calloutTimer = null;
  SFX.onBanner(function(text, big){
    var c = document.getElementById("callout"); if (!c) return;
    c.textContent = text; c.className = "callout show" + (big ? " big" : "");
