name: Album sync
# Pulls new photos from the Foreunder Album Drive folder every 3 hours (or on demand from the Actions tab).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: album-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: python scripts/album_sync.py
        env:
          ALBUM_FOLDER_ID: ${{ secrets.ALBUM_FOLDER_ID }}
      - name: Publish
        run: |
          git add album
          if git diff --cached --quiet; then echo "No new photos"; exit 0; fi
          git -c user.name="Foreunder Album" -c user.email="jamey.conrad@gmail.com" commit -m "Album: sync from Drive"
          git push
